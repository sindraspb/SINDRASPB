<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias - SINDRAS</title>

<!-- FORÇANDO ATUALIZAÇÃO DO DESIGN -->
<link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<header class="header">
  <div class="container nav">
    <img src="logo.png" class="logo">

    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="Fotos.html">Fotos</a></li> 
      <li><a href="parceiros.html">Parceiros</a></li>
    </ul>
  </div>
</header>

<section class="noticias container">
  <h1>📰 Central de Notícias</h1>
  <div id="listaNoticias" class="cards"></div>
</section>

<footer class="footer">
  <p>© Sindras-PB</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmwzsjxXLCU0M3SRf0v3C8cPTVvTzE6Hk",
  authDomain: "sindraspb-35551.firebaseapp.com",
  projectId: "sindraspb-35551"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("listaNoticias");

const q = query(
  collection(db,"noticias"),
  orderBy("criadoEm","desc")
);

onSnapshot(q, snap=>{
  container.innerHTML = "";

  if(snap.empty){
    container.innerHTML = "<p>Nenhuma notícia cadastrada no momento.</p>";
    return;
  }

  snap.forEach(doc=>{
    const n = doc.data();
    let htmlImagens = "";

    if(n.imagens && n.imagens.length > 0){
      const fotosValidas = n.imagens.filter(img => img && img.trim() !== "");
      
      if(fotosValidas.length > 0){
        const secundarias = fotosValidas.slice(1, 4);
        const classeMosaico = fotosValidas.length > 1 ? "mosaico" : "mosaico uma-imagem";
        
        let htmlSecundarias = "";
        if(secundarias.length > 0) {
          htmlSecundarias = `
            <div class="img-secundarias" style="grid-template-rows: repeat(${secundarias.length}, 1fr)">
              ${secundarias.map(img => `<img src="${img}">`).join("")}
            </div>
          `;
        }

        htmlImagens = `
          <div class="${classeMosaico}">
            <div class="img-principal">
              <img src="${fotosValidas[0]}">
            </div>
            ${htmlSecundarias}
          </div>
        `;
      }
    } else if(n.imagem && n.imagem.trim() !== "") {
      htmlImagens = `<img src="${n.imagem}" class="fallback-img">`;
    }

    container.innerHTML += `
      <div class="card">
        ${htmlImagens}
        <h3>${n.titulo || "Sem título"}</h3>
        <div class="texto-noticia">
          ${n.conteudo ? n.conteudo.replace(/\n/g, "<br>") : ""}
        </div>
      </div>
    `;
  });
});
</script>

</body>
</html>
