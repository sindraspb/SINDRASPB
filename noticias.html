<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias - SINDRAS</title>

<link rel="stylesheet" href="style.css">

<style>
/* Ajustes preventivos para o mosaico de notícias caso as classes não estejam no style.css global */
.mosaico {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 5px;
  margin-bottom: 15px;
}

.mosaico.uma-imagem {
  grid-template-columns: 1fr;
}

.img-principal img {
  width: 100%;
  height: 350px;
  object-fit: cover;
  border-radius: 8px;
}

.img-secundarias {
  display: grid;
  gap: 5px;
}

.img-secundarias img {
  width: 100%;
  height: 100%;
  min-height: 110px;
  object-fit: cover;
  border-radius: 8px;
}

.card img.fallback-img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 15px;
}

@media(max-width:768px){
  .mosaico {
    grid-template-columns: 1fr;
  }
  .img-principal img {
    height: 220px;
  }
  .img-secundarias {
    grid-template-columns: repeat(3, 1fr);
  }
  .img-secundarias img {
    height: 80px;
    min-height: auto;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="container nav">
    <img src="logo.png" class="logo">

    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="Fotos.html">Fotos</a></li> <li><a href="parceiros.html">Parceiros</a></li>
    </ul>
  </div>
</header>

<section class="noticias container">
  <h1>📰 Central de Notícias</h1>
  <div id="listaNoticias" class="cards"></div>
</section>

<footer class="footer">
  <p>© Sindras-PB</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmwzsjxXLCU0M3SRf0v3C8cPTVvTzE6Hk",
  authDomain: "sindraspb-35551.firebaseapp.com",
  projectId: "sindraspb-35551"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("listaNoticias");

const q = query(
  collection(db,"noticias"),
  orderBy("criadoEm","desc")
);

onSnapshot(q, snap=>{
  container.innerHTML = "";

  if(snap.empty){
    container.innerHTML = "<p>Nenhuma notícia cadastrada no momento.</p>";
    return;
  }

  snap.forEach(doc=>{
    const n = doc.data();
    let htmlImagens = "";

    // Tratamento adaptativo para o mosaico de fotos da notícia
    if(n.imagens && n.imagens.length > 0){
      const fotosValidas = n.imagens.filter(img => img && img.trim() !== "");
      
      if(fotosValidas.length > 0){
        const secundarias = fotosValidas.slice(1, 4);
        const classeMosaico = fotosValidas.length > 1 ? "mosaico" : "mosaico uma-imagem";
        
        let htmlSecundarias = "";
        if(secundarias.length > 0) {
          htmlSecundarias = `
            <div class="img-secundarias" style="grid-template-rows: repeat(${secundarias.length}, 1fr)">
              ${secundarias.map(img => `<img src="${img}">`).join("")}
            </div>
          `;
        }

        htmlImagens = `
          <div class="${classeMosaico}">
            <div class="img-principal">
              <img src="${fotosValidas[0]}">
            </div>
            ${htmlSecundarias}
          </div>
        `;
      }
    } else if(n.imagem && n.imagem.trim() !== "") {
      // Fallback para posts antigos estruturados com campo único de imagem
      htmlImagens = `<img src="${n.imagem}" class="fallback-img">`;
    }

    // CORREÇÃO: Inclusão do fechamento correto das tags </div> no final do template literal
    container.innerHTML += `
      <div class="card" style="margin-bottom: 30px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        ${htmlImagens}
        <h3 style="margin-top: 10px; font-size: 20px;">${n.titulo || "Sem título"}</h3>
        <div class="texto-noticia" style="color: #444; line-height: 1.6; margin-top: 10px;">
          ${n.conteudo ? n.conteudo.replace(/\n/g, "<br>") : ""}
        </div>
      </div>
    `;
  });
});
</script>

</body>
</html>
