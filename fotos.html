<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Fotos - SINDRAS-PB</title>

<!-- FORÇANDO ATUALIZAÇÃO DO DESIGN -->
<link rel="stylesheet" href="style.css?v=3">

<style>
.galeria-page{
  padding:50px 0;
}

.galeria-page h1{
  text-align:center;
  margin-bottom:30px;
}

.album{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:30px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.album h2{
  margin:15px 0 10px;
}

.album p{
  color:#555;
}

.mosaico img{
  cursor:pointer;
  transition:.3s;
}

.mosaico img:hover{
  transform:scale(1.02);
}

.ver-mais{
  display:inline-block;
  margin-top:15px;
  background:#f7941d;
  color:#fff;
  text-decoration:none;
  padding:10px 20px;
  border-radius:8px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  border: none;
}

.ver-mais:hover {
  background: #d97f14;
}

/* LIGHTBOX MODAL */
.lightbox-modal {
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.lightbox-modal.active {
  display: flex;
  opacity: 1;
}

.lightbox-content {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(255,255,255,0.1);
  transform: scale(0.9);
  transition: transform 0.3s ease;
}

.lightbox-modal.active .lightbox-content {
  transform: scale(1);
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: #fff;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.lightbox-close:hover {
  color: #f7941d;
}

.lightbox-nav {
  position: absolute;
  color: white;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  top: 50%;
  transform: translateY(-50%);
  padding: 15px;
  user-select: none;
  transition: 0.2s;
}
.lightbox-nav:hover { color: #f7941d; }
.nav-left { left: 20px; }
.nav-right { right: 20px; }

@media(max-width:768px){
  .lightbox-nav { font-size: 30px; padding: 5px; }
}
</style>
</head>

<body>

<header class="header">
  <div class="container nav">
    <img src="logo.png" class="logo">
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="Fotos.html">Fotos</a></li>
      <li><a href="parceiros.html">Parceiros</a></li>
    </ul>
  </div>
</header>

<section class="galeria-page container">
  <h1>📸 Galeria de Fotos</h1>
  <div id="Eventos"></div>
</section>

<div id="lightbox" class="lightbox-modal">
  <span class="lightbox-close" id="lightboxClose">&times;</span>
  <span class="lightbox-nav nav-left" id="lightboxPrev">&#10094;</span>
  <img class="lightbox-content" id="lightboxImg" src="" alt="Imagem ampliada">
  <span class="lightbox-nav nav-right" id="lightboxNext">&#10095;</span>
</div>

<footer class="footer">
  <p>© Sindras-PB</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmwzsjxXLCU0M3SRf0v3C8cPTVvTzE6Hk",
  authDomain: "sindraspb-35551.firebaseapp.com",
  projectId: "sindraspb-35551"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("Eventos");
let albunsCarregados = {};

const q = query(
  collection(db,"Fotos"),
  orderBy("criadoEm","desc")
);

onSnapshot(q,(snap)=>{
  container.innerHTML = "";
  albunsCarregados = {};

  if(snap.empty){
    container.innerHTML = `<div class="album"><h2>Nenhum álbum cadastrado.</h2></div>`;
    return;
  }

  snap.forEach(docItem=>{
    const idAlbum = docItem.id;
    const album = docItem.data();
    let htmlImagens = "";

    if(album.imagens && album.imagens.length > 0){
      const fotosValidas = album.imagens.filter(img => img && img.trim() !== "");
      albunsCarregados[idAlbum] = fotosValidas;

      const classeMosaico = fotosValidas.length > 1 ? "mosaico" : "mosaico uma-imagem";
      const secundarias = fotosValidas.slice(1,4);
      
      let htmlSecundarias = "";
      if(secundarias.length > 0) {
        htmlSecundarias = `
          <div class="img-secundarias" style="grid-template-rows: repeat(${secundarias.length}, 1fr)">
            ${secundarias.map((img, index) => `
              <img src="${img}" class="abrir-zoom" data-album="${idAlbum}" data-index="${index + 1}">
            `).join("")}
          </div>
        `;
      }

      htmlImagens = `
      <div class="${classeMosaico}">
        <div class="img-principal">
          <img src="${fotosValidas[0]}" class="abrir-zoom" data-album="${idAlbum}" data-index="0">
        </div>
        ${htmlSecundarias}
      </div>
      `;
    }

    const totalFotos = album.imagens ? album.imagens.length : 0;
    const botaoVerMais = totalFotos > 4 
      ? `<button class="ver-mais" onclick="abrirAlbumCompleto('${idAlbum}')">Ver todas as (${totalFotos}) fotos</button>` 
      : "";

    container.innerHTML += `
      <div class="album">
        ${htmlImagens}
        <h2>${album.titulo || ""}</h2>
        <p>${album.descricao || ""}</p>
        <p><strong>Total de Fotos:</strong> ${totalFotos}</p>
        ${botaoVerMais}
      </div>
    `;
  });

  configurarZoom();
});

let fotosAtuaisDoSlider = [];
let indexAtualDoSlider = 0;

function configurarZoom() {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const btnClose = document.getElementById("lightboxClose");
  const btnPrev = document.getElementById("lightboxPrev");
  const btnNext = document.getElementById("lightboxNext");
  const imagensGaleria = document.querySelectorAll(".abrir-zoom");

  imagensGaleria.forEach(img => {
    img.onclick = function() {
      const idAlbum = this.getAttribute("data-album");
      const indexFoto = parseInt(this.getAttribute("data-index"));
      
      fotosAtuaisDoSlider = albunsCarregados[idAlbum];
      indexAtualDoSlider = indexFoto;

      atualizarImagemSlider();
      lightbox.classList.add("active");
    }
  });

  function atualizarImagemSlider() {
    lightboxImg.src = fotosAtuaisDoSlider[indexAtualDoSlider];
  }

  btnNext.onclick = function(e) {
    e.stopPropagation();
    indexAtualDoSlider = (indexAtualDoSlider + 1) % fotosAtuaisDoSlider.length;
    atualizarImagemSlider();
  }

  btnPrev.onclick = function(e) {
    e.stopPropagation();
    indexAtualDoSlider = (indexAtualDoSlider - 1 + fotosAtuaisDoSlider.length) % fotosAtuaisDoSlider.length;
    atualizarImagemSlider();
  }

  btnClose.onclick = function() { lightbox.classList.remove("active"); }
  lightbox.onclick = function(e) {
    if(e.target !== lightboxImg && e.target !== btnClose && e.target !== btnPrev && e.target !== btnNext) {
      lightbox.classList.remove("active");
    }
  }

  window.abrirAlbumCompleto = function(idAlbum) {
    fotosAtuaisDoSlider = albunsCarregados[idAlbum];
    indexAtualDoSlider = 0;
    atualizarImagemSlider();
    lightbox.classList.add("active");
  }
}
</script>

</body>
</html>
