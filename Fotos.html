<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Fotos - SINDRAS-PB</title>

<link rel="stylesheet" href="style.css">

<style>
.galeria-page{
  padding:50px 0;
}

.galeria-page h1{
  text-align:center;
  margin-bottom:30px;
}

.album{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:30px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.album h2{
  margin:15px 0 10px;
}

.album p{
  color:#555;
}

.mosaico{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:5px;
}

.mosaico.uma-imagem {
  grid-template-columns: 1fr;
}

.img-principal img{
  width:100%;
  height:450px;
  object-fit:cover;
  border-radius:8px;
}

.img-secundarias{
  display:grid;
  grid-template-rows:repeat(3,1fr);
  gap:5px;
}

.img-secundarias img{
  width:100%;
  height:146px;
  object-fit:cover;
  border-radius:8px;
}

.mosaico img{
  cursor:pointer;
  transition:.3s;
}

.mosaico img:hover{
  transform:scale(1.03);
}

/* ========================================================
   🔥 NOVO CSS: MODAL DE ZOOM (LIGHTBOX)
   ======================================================== */
.lightbox-modal {
  display: none; /* Escondido por padrão */
  position: fixed;
  z-index: 9999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.lightbox-modal.active {
  display: flex;
  opacity: 1;
}

.lightbox-content {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(255,255,255,0.1);
  transform: scale(0.9);
  transition: transform 0.3s ease;
}

.lightbox-modal.active .lightbox-content {
  transform: scale(1);
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: #fff;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.lightbox-close:hover {
  color: #f7941d;
}

@media(max-width:768px){
  .mosaico{
    grid-template-columns:1fr;
  }

  .mosaico.uma-imagem {
    grid-template-columns: 1fr;
  }

  .img-principal img{
    height:250px;
  }

  .img-secundarias{
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:none;
  }

  .img-secundarias img{
    height:90px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="container nav">
    <img src="logo.png" class="logo">
    <ul class="menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      <li><a href="Fotos.html">Fotos</a></li>
      <li><a href="parceiros.html">Parceiros</a></li>
    </ul>
  </div>
</header>

<section class="galeria-page container">
  <h1>📸 Galeria de Fotos</h1>
  <div id="Eventos"></div>
</section>

<div id="lightbox" class="lightbox-modal">
  <span class="lightbox-close" id="lightboxClose">&times;</span>
  <img class="lightbox-content" id="lightboxImg" src="" alt="Imagem ampliada">
</div>

<footer class="footer">
  <p>© Sindras-PB</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmwzsjxXLCU0M3SRf0v3C8cPTVvTzE6Hk",
  authDomain: "sindraspb-35551.firebaseapp.com",
  projectId: "sindraspb-35551"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("Eventos");

const q = query(
  collection(db,"Fotos"),
  orderBy("criadoEm","desc")
);

onSnapshot(q,(snap)=>{
  container.innerHTML = "";

  if(snap.empty){
    container.innerHTML = `
      <div class="album">
        <h2>Nenhum álbum cadastrado.</h2>
      </div>
    `;
    return;
  }

  snap.forEach(docItem=>{
    const album = docItem.data();
    let htmlImagens = "";

    if(album.imagens && album.imagens.length > 0){
      const fotosValidas = album.imagens.filter(img => img && img.trim() !== "");
      const classeMosaico = fotosValidas.length > 1 ? "mosaico" : "mosaico uma-imagem";
      const secundarias = fotosValidas.slice(1,4);
      
      let htmlSecundarias = "";
      
      if(secundarias.length > 0) {
        htmlSecundarias = `
          <div class="img-secundarias" style="grid-template-rows: repeat(${secundarias.length}, 1fr)">
            ${secundarias.map(img => `
              <img src="${img}" class="abrir-zoom" style="cursor: pointer;">
            `).join("")}
          </div>
        `;
      }

      htmlImagens = `
      <div class="${classeMosaico}">
        <div class="img-principal">
          <img src="${fotosValidas[0]}" class="abrir-zoom" style="cursor: pointer;">
        </div>
        ${htmlSecundarias}
      </div>
      `;
    }

    container.innerHTML += `
      <div class="album">
        ${htmlImagens}
        <h2>${album.titulo || ""}</h2>
        <p>${album.descricao || ""}</p>
        <p><strong>Total de Fotos:</strong> ${album.imagens ? album.imagens.length : 0}</p>
      </div>
    `;
  });

  // Ativa as escutas de clique nas novas imagens criadas dinamicamente
  configurarZoom();
});

/* ========================================================
   🔥 NOVO SCRIPT: MECANISMO DE AMPLIAR IMAGEM IN-PAGE
   ======================================================== */
function configurarZoom() {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const btnClose = document.getElementById("lightboxClose");
  const imagensGaleria = document.querySelectorAll(".abrir-zoom");

  imagensGaleria.forEach(img => {
    img.onclick = function() {
      lightboxImg.src = this.src; // Passa o caminho da foto pro modal
      lightbox.classList.add("active"); // Mostra o modal com efeito suave
    }
  });

  // Fecha ao clicar no botão 'X'
  btnClose.onclick = function() {
    lightbox.classList.remove("active");
  }

  // Fecha se o usuário clicar em qualquer parte escura fora da imagem
  lightbox.onclick = function(e) {
    if(e.target !== lightboxImg && e.target !== btnClose) {
      lightbox.classList.remove("active");
    }
  }
}
</script>

</body>
</html>
